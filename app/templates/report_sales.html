{% extends 'base.html' %}{% block content %}<h1>Resumen de ventas</h1><div class="cards"><article><span>Total confirmado</span><strong>{{total|ars}}</strong></article><article><span>Cantidad de ventas</span><strong>{{count}}</strong></article></div><h2>Por medio de pago</h2><table><thead><tr><th>Medio</th><th>Total</th></tr></thead><tbody>{% for method, amount in by_payment %}<tr><td>{{method.title()}}</td><td>{{amount|ars}}</td></tr>{% else %}<tr><td colspan="2">Sin ventas.</td></tr>{% endfor %}</tbody></table>{% endblock %}
