{% extends 'base.html' %}{% block content %}<h1>Nueva venta</h1><div class="pos"><section><input id="find" placeholder="Escanee o busque un producto" autofocus><div id="product-list">{% for p in products %}<button class="product" data-id="{{p.id}}" data-name="{{p.name}}" data-price="{{p.sale_price}}" data-stock="{{p.stock}}">{{p.code}} · {{p.name}}<small>Stock {{p.stock}} · {{p.sale_price|ars}}</small></button>{% endfor %}</div></section><section class="cart"><h2>Carrito</h2><div id="cart"></div><p class="total">Total <strong id="total">$ 0,00</strong></p><h3>Pagos</h3><div id="payments"><div><select><option value="EFECTIVO">Efectivo</option><option value="DEBITO">Débito</option><option value="CREDITO">Crédito</option></select><input type="number" step="0.01" min="0" placeholder="Importe"></div></div><button type="button" class="link" id="add-payment">+ Agregar otro pago</button><button id="confirm" class="button">Confirmar venta</button></section></div><script>const items=[];const f=n=>'$ '+Number(n).toLocaleString('es-AR',{minimumFractionDigits:2});function draw(){let t=0;document.querySelector('#cart').innerHTML=items.map((x,i)=>{t+=x.price*x.qty;return `<div class="cartline"><span>${x.name}</span><input data-i="${i}" class="qty" type="number" min="1" step="1" value="${x.qty}"><b>${f(x.price*x.qty)}</b><button data-remove="${i}">×</button></div>`}).join('')||'<p>Sin productos.</p>';document.querySelector('#total').textContent=f(t);return t}document.querySelectorAll('.product').forEach(b=>b.onclick=()=>{let x=items.find(i=>i.id==b.dataset.id);if(x){if(x.qty<Number(b.dataset.stock))x.qty++}else if(Number(b.dataset.stock)>0)items.push({id:b.dataset.id,name:b.dataset.name,price:Number(b.dataset.price),qty:1});draw()});document.querySelector('#cart').onclick=e=>{if(e.target.className==='qty'){items[e.target.dataset.i].qty=Number(e.target.value);draw()}if(e.target.dataset.remove!==undefined){items.splice(e.target.dataset.remove,1);draw()}};document.querySelector('#find').oninput=e=>document.querySelectorAll('.product').forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(e.target.value.toLowerCase()));document.querySelector('#add-payment').onclick=()=>document.querySelector('#payments').insertAdjacentHTML('beforeend','<div><select><option value="EFECTIVO">Efectivo</option><option value="DEBITO">Débito</option><option value="CREDITO">Crédito</option></select><input type="number" step="0.01" min="0" placeholder="Importe"></div>');document.querySelector('#confirm').onclick=async()=>{let total=draw(),payments=[...document.querySelectorAll('#payments div')].map(x=>({method:x.querySelector('select').value,amount:x.querySelector('input').value})).filter(p=>p.amount);let r=await fetch('{{url_for('sale_create')}}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({items,payments})});let d=await r.json();if(d.ok)location=d.redirect;else alert(d.error)};draw();</script>{% endblock %}
