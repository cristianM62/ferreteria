{% extends 'base.html' %}
{% block content %}
<h1>Nueva venta</h1>
<div class="pos">
  <section>
    <div class="customer-choice"><b>¿La venta es para un cliente?</b><label><input type="radio" name="has_customer" value="no" checked> No</label><label><input type="radio" name="has_customer" value="yes"> Sí</label></div>
    <div id="customer-panel" hidden><label>Clientes<input id="customer-search" placeholder="Escriba para filtrar la lista de clientes"></label><select id="customer"><option value="" data-discount="0">Seleccione un cliente</option>{% for c in customers %}<option value="{{c.id}}" data-discount="{{c.discount_percent}}">{{c.last_name+', '+c.first_name if c.first_name else c.name}} · DNI {{c.dni or '—'}} · {{c.phone}} · {{c.discount_percent}}% desc.</option>{% endfor %}</select></div>
    <div class="scan-row"><input id="code-entry" placeholder="Escanee código de barras o escriba el código del producto" autofocus><button type="button" id="add-code">Agregar por código</button></div>
    <input id="find" placeholder="Buscar y seleccionar producto">
    <div id="product-list">{% for p in products %}<button type="button" class="product" data-id="{{p.id}}" data-code="{{p.code}}" data-barcode="{{p.barcode or ''}}" data-name="{{p.name}}{% if p.category %} · {{p.category.name}}{% if p.subcategory %} / {{p.subcategory.name}}{% endif %}{% endif %}" data-box="{{p.box_price}}" data-unit="{{p.unit_price}}" data-boxes="{{p.closed_boxes}}" data-loose="{{p.loose_units}}" data-per-box="{{p.units_per_box}}" data-has-box="{{ 1 if p.has_box_presentation else 0 }}">{{p.code}} · {{p.name}}{% if p.category %}<small>{{p.category.name}}{% if p.subcategory %} · {{p.subcategory.name}}{% endif %}</small>{% endif %}<small>{{p.closed_boxes}} cajas + {{p.loose_units}} unidades{% if p.has_box_presentation %} · {{p.units_per_box}} por caja{% endif %}</small><small>{% if p.has_box_presentation %}Caja {{p.box_price|ars}} · {% endif %}Unidad {{p.unit_price|ars}}</small></button>{% endfor %}</div>
  </section>
  <section class="cart"><h2>Carrito</h2><div id="cart"></div><div class="sale-totals"><p>Subtotal <strong id="subtotal">$ 0,00</strong></p><p id="discount-row" hidden>Descuento de cliente <strong id="discount-total">-$ 0,00</strong></p><p class="total">Total <strong id="total">$ 0,00</strong></p></div><h3>Pagos</h3><div id="payments"><div><select><option value="EFECTIVO">Efectivo</option><option value="DEBITO">Débito</option><option value="CREDITO">Crédito</option></select><input type="number" step="0.01" min="0" placeholder="Importe"></div></div><button type="button" class="link" id="add-payment">+ Agregar otro pago</button><button id="confirm" class="button">Confirmar venta</button></section>
</div>
<dialog id="presentation-dialog"><form method="dialog"><h2 id="dialog-title">Agregar producto</h2><label id="presentation-field">Presentación<select id="presentation"><option value="CAJA">Caja completa</option><option value="UNIDAD">Unidad / fracción</option></select></label><label>Cantidad<input id="presentation-quantity" type="number" min="1" step="1" value="1" required></label><p id="available"></p><menu><button value="cancel">Cancelar</button><button id="add-item" value="default">Agregar al carrito</button></menu></form></dialog>
<script>
const items=[], products=[...document.querySelectorAll('.product')], dialog=document.querySelector('#presentation-dialog'); let selected=null;
const f=n=>'$ '+Number(n).toLocaleString('es-AR',{minimumFractionDigits:2}); const discount=()=>Number(document.querySelector('#customer').selectedOptions[0]?.dataset.discount||0);
function draw(){let subtotal=0,total=0;document.querySelector('#cart').innerHTML=items.map((x,i)=>{let original=x.price*x.qty,price=x.price*(1-discount()/100),sub=price*x.qty;subtotal+=original;total+=sub;return '<div class="cartline"><span>'+x.name+'<small>'+(x.presentation==='CAJA'?'Caja completa':'Unidad individual')+(discount()?' · '+discount()+'% desc.':'')+'</small></span><input data-i="'+i+'" class="qty" type="number" min="1" step="1" value="'+x.qty+'"><b>'+f(sub)+'</b><button data-remove="'+i+'">×</button></div>'}).join('')||'<p>Sin productos.</p>';document.querySelector('#subtotal').textContent=f(subtotal);document.querySelector('#total').textContent=f(total);let discountAmount=subtotal-total;document.querySelector('#discount-row').hidden=discountAmount<=0;document.querySelector('#discount-total').textContent='-'+f(discountAmount)}
function max(){return document.querySelector('#presentation').value==='CAJA'?Number(selected.dataset.boxes):Number(selected.dataset.boxes)*Number(selected.dataset.perBox)+Number(selected.dataset.loose)}
function refreshDialog(){let box=document.querySelector('#presentation').value==='CAJA';document.querySelector('#available').textContent='Disponibles: '+max()+' '+(box?'cajas':'unidades');document.querySelector('#presentation-quantity').max=max()}
function addUnitOnlyProduct(button){let available=Number(button.dataset.boxes)*Number(button.dataset.perBox)+Number(button.dataset.loose);if(available<1){alert('Sin stock disponible');return}let x=items.find(i=>i.id===button.dataset.id&&i.presentation==='UNIDAD');if(x)x.qty+=1;else items.push({id:button.dataset.id,name:button.dataset.name,presentation:'UNIDAD',price:Number(button.dataset.unit),qty:1});draw()}
function selectProduct(button){selected=button;let canBox=button.dataset.hasBox==='1';if(!canBox){addUnitOnlyProduct(button);return}document.querySelector('#dialog-title').textContent=button.dataset.name;document.querySelector('#presentation-field').hidden=false;document.querySelector('#presentation').value=Number(button.dataset.boxes)>0?'CAJA':'UNIDAD';refreshDialog();dialog.showModal();document.querySelector('#presentation-quantity').focus()}
products.forEach(b=>b.onclick=()=>selectProduct(b));document.querySelector('#presentation').onchange=refreshDialog;
document.querySelector('#add-item').onclick=e=>{let presentation=document.querySelector('#presentation').value,qty=Number(document.querySelector('#presentation-quantity').value);if(!Number.isInteger(qty)||qty<1||qty>max()){e.preventDefault();alert('Cantidad inválida');return}let x=items.find(i=>i.id===selected.dataset.id&&i.presentation===presentation);if(x)x.qty+=qty;else items.push({id:selected.dataset.id,name:selected.dataset.name,presentation,price:Number(presentation==='CAJA'?selected.dataset.box:selected.dataset.unit),qty});draw()};
function addByCode(){let code=document.querySelector('#code-entry').value.trim().toLowerCase(),p=products.find(x=>x.dataset.code.toLowerCase()===code||x.dataset.barcode.toLowerCase()===code);if(!p){alert('No se encontró un producto con ese código');return}document.querySelector('#code-entry').value='';selectProduct(p)}
document.querySelector('#add-code').onclick=addByCode;document.querySelector('#code-entry').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();addByCode()}};
document.querySelectorAll('input[name=has_customer]').forEach(r=>r.onchange=()=>{let yes=document.querySelector('input[name=has_customer]:checked').value==='yes';document.querySelector('#customer-panel').hidden=!yes;if(!yes)document.querySelector('#customer').value='';draw()});
document.querySelector('#customer-search').oninput=e=>[...document.querySelector('#customer').options].forEach(o=>o.hidden=o.value&&!o.text.toLowerCase().includes(e.target.value.toLowerCase()));document.querySelector('#customer').onchange=draw;document.querySelector('#find').oninput=e=>products.forEach(b=>b.hidden=!b.textContent.toLowerCase().includes(e.target.value.toLowerCase()));
document.querySelector('#cart').onchange=e=>{if(e.target.className==='qty'){items[e.target.dataset.i].qty=Number(e.target.value);draw()}};document.querySelector('#cart').onclick=e=>{if(e.target.dataset.remove!==undefined){items.splice(e.target.dataset.remove,1);draw()}};
document.querySelector('#add-payment').onclick=()=>document.querySelector('#payments').insertAdjacentHTML('beforeend','<div><select><option value="EFECTIVO">Efectivo</option><option value="DEBITO">Débito</option><option value="CREDITO">Crédito</option></select><input type="number" step="0.01" min="0" placeholder="Importe"></div>');
document.querySelector('#confirm').onclick=async()=>{let payments=[...document.querySelectorAll('#payments div')].map(x=>({method:x.querySelector('select').value,amount:x.querySelector('input').value})).filter(p=>p.amount),r=await fetch('{{url_for('sale_create')}}',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_id:document.querySelector('#customer').value,items,payments})}),d=await r.json();if(d.ok)location=d.redirect;else alert(d.error)};
draw();
</script>{% endblock %}
