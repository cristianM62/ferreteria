{% extends 'base.html' %}{% block content %}
<h1>{{ 'Editar' if product else 'Nuevo' }} producto</h1>
<form method="post" class="form-grid" enctype="multipart/form-data">
<label>Código<input name="code" class="{{'invalid' if field_errors.get('code')}}" value="{{ product.code if product else form_data.get('code','') }}" required>{% if field_errors.get('code') %}<small class="field-error">{{field_errors.code}}</small>{% endif %}</label><label>Código de barras<input name="barcode" class="{{'invalid' if field_errors.get('barcode')}}" value="{{ product.barcode if product and product.barcode else form_data.get('barcode','') }}">{% if field_errors.get('barcode') %}<small class="field-error">{{field_errors.barcode}}</small>{% endif %}</label><label class="wide">Nombre<input name="name" value="{{ product.name if product else form_data.get('name','') }}" required></label>
<label>Categoría<select name="category_id"><option value="">Sin categoría</option>{% for c in categories %}<option value="{{c.id}}" {% if (product and product.category_id==c.id) or (not product and form_data.get('category_id')==c.id|string) %}selected{% endif %}>{{c.name}}</option>{% endfor %}</select></label><label>Subcategoría<select name="subcategory_id"><option value="">Sin subcategoría</option>{% for s in subcategories %}<option value="{{s.id}}" {% if (product and product.subcategory_id==s.id) or (not product and form_data.get('subcategory_id')==s.id|string) %}selected{% endif %}>{{s.category.name}} · {{s.name}}</option>{% endfor %}</select></label><label class="wide">Proveedor<select name="supplier_id"><option value="">Sin proveedor asignado</option>{% for s in suppliers %}<option value="{{s.id}}" {% if (product and product.supplier_id==s.id) or (not product and form_data.get('supplier_id')==s.id|string) %}selected{% endif %}>{{s.name}}</option>{% endfor %}</select></label>
<label>Precio de compra<input type="number" step="0.01" min="0" name="purchase_price" value="{{ product.purchase_price if product else form_data.get('purchase_price','') }}"></label><label id="unit-price-row">Precio por unidad<input type="number" step="0.01" min="0" name="unit_price" value="{{ product.unit_price if product else form_data.get('unit_price','') }}" required></label><label>Stock mínimo (unidades)<input type="number" step="1" min="0" name="minimum_stock" value="{{ product.minimum_stock if product else form_data.get('minimum_stock','') }}"></label>
<label class="wide"><input id="has-box" type="checkbox" name="has_box_presentation" {% if (product and product.has_box_presentation) or (not product and form_data.get('has_box_presentation')) %}checked{% endif %}> Este producto también se vende por caja completa</label>
<div id="box-fields" class="form-grid wide"><label>Precio por caja<input type="number" step="0.01" min="0" name="box_price" value="{{ product.box_price if product else form_data.get('box_price','') }}"></label><label>Unidades por caja<input id="units-per-box" type="number" min="1" name="units_per_box" value="{{ product.units_per_box if product else form_data.get('units_per_box','') }}"></label>{% if not product %}<label>Cantidad de cajas iniciales<input id="closed-boxes" type="number" min="0" name="closed_boxes" value="{{form_data.get('closed_boxes','')}}"></label><p id="calculated-units">Las unidades iniciales se calculan automáticamente.</p>{% endif %}</div>
{% if not product %}<label id="loose-units-row">Unidades iniciales disponibles<input type="number" min="0" name="loose_units" value="{{form_data.get('loose_units','')}}"></label>{% endif %}
<label class="wide">Imagen del producto (opcional)<input id="product-image" type="file" name="image" accept="image/jpeg,image/png,image/webp"><small>Formatos permitidos: JPG, PNG o WebP. Tamaño máximo: 5 MB.</small></label>
<div id="image-preview-wrap" class="wide image-preview-wrap" {% if not product or not product.image_filename %}hidden{% endif %}>
  <img id="image-preview" class="product-image-preview" {% if product and product.image_filename %}src="{{ url_for('static', filename='uploads/products/' ~ product.image_filename) }}"{% endif %} alt="Vista previa de la imagen">
</div>
<label class="wide">Descripción<textarea name="description">{{ product.description if product else form_data.get('description','') }}</textarea></label>{% if product %}<label><input type="checkbox" name="active" {% if product.active %}checked{% endif %}> Producto activo</label>{% endif %}<div class="form-actions"><button class="action-save">Guardar</button> <a class="button secondary" href="{{url_for('products')}}">Cancelar</a></div>
</form>
<script>const check=document.querySelector('#has-box'),box=document.querySelector('#box-fields'),perBox=document.querySelector('#units-per-box'),boxes=document.querySelector('#closed-boxes'),calculated=document.querySelector('#calculated-units'),loose=document.querySelector('#loose-units-row');function updateTotal(){if(calculated)calculated.textContent='Unidades iniciales por cajas: '+((Number(perBox.value)||0)*(Number(boxes.value)||0))}function toggleBox(){box.hidden=!check.checked;if(loose)loose.hidden=check.checked;box.querySelectorAll('input').forEach(i=>i.required=check.checked);updateTotal()}check.onchange=toggleBox;perBox.oninput=updateTotal;if(boxes)boxes.oninput=updateTotal;toggleBox();const imageInput=document.querySelector('#product-image'),preview=document.querySelector('#image-preview'),previewWrap=document.querySelector('#image-preview-wrap');imageInput.onchange=()=>{const file=imageInput.files[0];if(!file)return;preview.src=URL.createObjectURL(file);previewWrap.hidden=false};</script>
{% endblock %}
