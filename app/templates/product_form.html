{% extends 'base.html' %}{% block content %}<h1>{{'Editar' if product else 'Nuevo'}} producto</h1><form method="post" class="form-grid"><label>Código<input name="code" value="{{product.code if product else ''}}" required></label><label>Código de barras<input name="barcode" value="{{product.barcode if product and product.barcode else ''}}"></label><label class="wide">Nombre<input name="name" value="{{product.name if product else ''}}" required></label><label>Precio compra<input type="number" step="0.01" min="0" name="purchase_price" value="{{product.purchase_price if product else 0}}"></label><label>Precio venta<input type="number" step="0.01" min="0" name="sale_price" value="{{product.sale_price if product else ''}}" required></label><label>Stock mínimo<input type="number" step="0.001" min="0" name="minimum_stock" value="{{product.minimum_stock if product else 0}}"></label>{% if not product %}<label>Stock inicial<input type="number" step="0.001" min="0" name="initial_stock" value="0"></label>{% endif %}<label class="wide">Descripción<textarea name="description">{{product.description if product else ''}}</textarea></label>{% if product %}<label><input type="checkbox" name="active" {% if product.active %}checked{% endif %}> Producto activo</label>{% endif %}<div><button>Guardar</button><a href="{{url_for('products')}}">Cancelar</a></div></form>{% endblock %}
