{% extends 'base.html' %}{% block content %}
<h1>{{ 'Editar' if product else 'Nuevo' }} producto</h1>
<form method="post" class="form-grid">
<label>Código<input name="code" value="{{ product.code if product else '' }}" required></label><label>Código de barras<input name="barcode" value="{{ product.barcode if product and product.barcode else '' }}"></label><label class="wide">Nombre<input name="name" value="{{ product.name if product else '' }}" required></label>
<label>Categoría<select name="category_id"><option value="">Sin categoría</option>{% for c in categories %}<option value="{{c.id}}" {% if product and product.category_id==c.id %}selected{% endif %}>{{c.name}}</option>{% endfor %}</select></label><label>Subcategoría<select name="subcategory_id"><option value="">Sin subcategoría</option>{% for s in subcategories %}<option value="{{s.id}}" {% if product and product.subcategory_id==s.id %}selected{% endif %}>{{s.category.name}} · {{s.name}}</option>{% endfor %}</select></label><label class="wide">Proveedor<select name="supplier_id"><option value="">Sin proveedor asignado</option>{% for s in suppliers %}<option value="{{s.id}}" {% if product and product.supplier_id==s.id %}selected{% endif %}>{{s.name}}</option>{% endfor %}</select></label>
<label>Precio de compra<input type="number" step="0.01" min="0" name="purchase_price" value="{{ product.purchase_price if product else '' }}"></label><label id="unit-price-row">Precio por unidad<input type="number" step="0.01" min="0" name="unit_price" value="{{ product.unit_price if product else '' }}" required></label><label>Stock mínimo (unidades)<input type="number" step="1" min="0" name="minimum_stock" value="{{ product.minimum_stock if product else '' }}"></label>
<label class="wide"><input id="has-box" type="checkbox" name="has_box_presentation" {% if product and product.has_box_presentation %}checked{% endif %}> Este producto también se vende por caja completa</label>
<div id="box-fields" class="form-grid wide"><label>Precio por caja<input type="number" step="0.01" min="0" name="box_price" value="{{ product.box_price if product else '' }}"></label><label>Unidades por caja<input id="units-per-box" type="number" min="1" name="units_per_box" value="{{ product.units_per_box if product else '' }}"></label>{% if not product %}<label>Cantidad de cajas iniciales<input id="closed-boxes" type="number" min="0" name="closed_boxes"></label><p id="calculated-units">Las unidades iniciales se calculan automáticamente.</p>{% endif %}</div>
{% if not product %}<label id="loose-units-row">Unidades iniciales disponibles<input type="number" min="0" name="loose_units"></label>{% endif %}
<label class="wide">Descripción<textarea name="description">{{ product.description if product else '' }}</textarea></label>{% if product %}<label><input type="checkbox" name="active" {% if product.active %}checked{% endif %}> Producto activo</label>{% endif %}<div><button>Guardar</button> <a href="{{url_for('products')}}">Cancelar</a></div>
</form>
<script>const check=document.querySelector('#has-box'),box=document.querySelector('#box-fields'),perBox=document.querySelector('#units-per-box'),boxes=document.querySelector('#closed-boxes'),calculated=document.querySelector('#calculated-units'),loose=document.querySelector('#loose-units-row');function updateTotal(){if(calculated)calculated.textContent='Unidades iniciales por cajas: '+((Number(perBox.value)||0)*(Number(boxes.value)||0))}function toggleBox(){box.hidden=!check.checked;if(loose)loose.hidden=check.checked;box.querySelectorAll('input').forEach(i=>i.required=check.checked);updateTotal()}check.onchange=toggleBox;perBox.oninput=updateTotal;if(boxes)boxes.oninput=updateTotal;toggleBox();</script>
{% endblock %}
